name: kilatmart

# Connection strings shared by the Go services (reused below via YAML anchors).
# Hosts are Compose service names and ports are container ports, not host ports.
# RabbitMQ credentials must match the user in rabbitmq/definitions.json.
# %2F is the URL-encoded name of the default vhost "/".
x-amqp-url: &amqp_url "amqp://kilatmart:kilatmart_dev_only@rabbitmq:5672/%2F"
x-database-url: &database_url "postgres://${POSTGRES_USER:-kilatmart}:${POSTGRES_PASSWORD:-kilatmart_dev_only}@postgres:5432/${POSTGRES_DB:-kilatmart}?sslmode=disable"

services:
  rabbitmq:
    image: rabbitmq:4.1-management
    restart: unless-stopped
    # Users, vhosts, and permissions come from rabbitmq/definitions.json.
    # RABBITMQ_DEFAULT_USER/PASS are ignored when definitions are loaded at boot.
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - kilatmart

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kilatmart}
      POSTGRES_USER: ${POSTGRES_USER:-kilatmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kilatmart_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kilatmart

  web-shop:
    build:
      context: ./backend
      args:
        SERVICE: web-shop
    restart: unless-stopped
    environment:
      PORT: "8080"
      AMQP_URL: *amqp_url
      DATABASE_URL: *database_url
    ports:
      - "127.0.0.1:${WEB_SHOP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/service", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - kilatmart

  billing:
    build:
      context: ./backend
      args:
        SERVICE: billing
    restart: unless-stopped
    environment:
      PORT: "8080"
      AMQP_URL: *amqp_url
      DATABASE_URL: *database_url
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/service", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - kilatmart

  shipping:
    build:
      context: ./backend
      args:
        SERVICE: shipping
    restart: unless-stopped
    environment:
      PORT: "8080"
      AMQP_URL: *amqp_url
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/service", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - kilatmart

volumes:
  rabbitmq_data:
  postgres_data:

networks:
  kilatmart:
    driver: bridge
